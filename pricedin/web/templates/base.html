<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PricedIn{% endblock %}</title>
  <style>
    :root { --fg: #1d1f23; --muted: #6b7079; --bg: #fbfbfa; --line: #e3e3df; --warn: #8a5a00; --warn-bg: #fff4d6; }
    @media (prefers-color-scheme: dark) {
      :root { --fg: #e8e8e6; --muted: #9a9ea6; --bg: #17181b; --line: #2c2e33; --warn: #f2c66d; --warn-bg: #3a2f14; }
    }
    body { margin: 0; font: 15px/1.5 system-ui, sans-serif; color: var(--fg); background: var(--bg); }
    main { max-width: 960px; margin: 0 auto; padding: 16px; }
    header.top { display: flex; gap: 16px; align-items: baseline; border-bottom: 1px solid var(--line); padding: 8px 16px; }
    header.top a { color: inherit; text-decoration: none; font-weight: 600; }
    .banner { background: var(--warn-bg); color: var(--warn); padding: 8px 16px; font-weight: 600; }
    .notice { background: var(--warn-bg); color: var(--warn); padding: 8px 12px; border-radius: 6px; }
    .muted { color: var(--muted); }
    .chart { height: 300px; margin: 8px 0 32px; }
    table { border-collapse: collapse; width: 100%; font-size: 14px; }
    th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--line); }
    input, button { font: inherit; padding: 4px 10px; }
  </style>
</head>
<body>
  <div class="banner">Unverified skeleton. No number on this page has a golden test yet.</div>
  <header class="top">
    <a href="{{ url_for('index') }}">PricedIn</a>
    <form action="{{ url_for('index') }}" method="get">
      <input name="ticker" placeholder="Ticker" size="8" autocomplete="off">
    </form>
  </header>
  <main>
    {% if ua_error %}<p class="notice">{{ ua_error }}</p>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
