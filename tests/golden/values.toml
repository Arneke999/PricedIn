# Golden values, hand-computed by Arne from 10-K filings.
#
# Hard rule 3: never edit a value here to make a test pass. A failing golden test means the
# code is wrong or a definition is ambiguous. Investigate, then report.
#
# Each value is from the most recent 10-K that shows that fiscal year (latest-restated),
# keyed by period end date. $ millions as printed; capex as a positive payment (the 10-K
# prints it in parentheses). Margins in percent, rounded to two decimals. Diluted shares in
# millions (weighted average for the year).
# Capex includes capitalized software (DECISIONS #40); FCF = operating cash flow - capex.
# Net income is attributable to the company (#33, #47); SBC is the cash-flow add-back (#52).
# ROIC (#53-#67): balances are year-end values, transcribed line by line as parts the test
# sums (equity = total_equity + redeemable_nci; debt = short_term_debt +
# current_long_term_debt + long_term_debt + finance leases; cash_and_short_term_investments =
# cash + short_term_investments + marketable_securities). invested_capital is Arne's own sum;
# roic in percent, from operating income, tax/pretax, and average invested capital.

