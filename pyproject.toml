[project]
name = "pricedin"
version = "0.0.1"
description = "Self-hosted stock research: long-run fundamentals from SEC filings, valuation, screening."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
